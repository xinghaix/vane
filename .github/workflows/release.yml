name: Release & GHCR

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Standard SemVer Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binaries:
    name: Package Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: Build Svelte 5 Web UI (.br & .gz)
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build static binary with cross
        if: matrix.use_cross
        run: |
          cargo install cross --version 0.2.5 --locked
          cross build --release --locked --target ${{ matrix.target }}

      - name: Build native binary
        if: '!matrix.use_cross'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          STAGE="vane-${TAG}-${{ matrix.target }}"
          mkdir -p dist-release
          cp "target/${{ matrix.target }}/release/vane" ./vane
          tar -czf "dist-release/${STAGE}.tar.gz" vane config.example.toml README.md README_CN.md LICENSE scripts/install.sh

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist-release/*.tar.gz

  publish-release:
    name: Publish GitHub Release & SHA256SUMS
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Sign SHA256SUMS (optional Ed25519 / minisign)
        working-directory: artifacts
        shell: bash
        env:
          VANE_RELEASE_SIGNING_KEY: ${{ secrets.VANE_RELEASE_SIGNING_KEY }}
          VANE_MINISIGN_PASSWORD: ${{ secrets.VANE_MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${VANE_RELEASE_SIGNING_KEY:-}" ]; then
            echo "Notice: secrets.VANE_RELEASE_SIGNING_KEY is not configured; skipping detached signature generation."
            exit 0
          fi
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          chmod 0600 "$KEY_FILE"
          printf '%s\n' "$VANE_RELEASE_SIGNING_KEY" > "$KEY_FILE"
          if head -n 1 "$KEY_FILE" | grep -q '^-----BEGIN '; then
            openssl pkeyutl -sign -inkey "$KEY_FILE" -rawin -in SHA256SUMS -out SHA256SUMS.sig
            # 同时为每个归档生成原始 Ed25519 分离签名（Base64），供 Web UI 手动上传更新验签
            for f in *.tar.gz; do
              openssl pkeyutl -sign -inkey "$KEY_FILE" -rawin -in "$f" | base64 -w 0 > "${f}.sig.b64"
            done
            echo "Signed SHA256SUMS (SHA256SUMS.sig) and archives (*.tar.gz.sig.b64) with Ed25519."
          elif head -n 1 "$KEY_FILE" | grep -q '^untrusted comment:'; then
            if ! command -v minisign >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y minisign
            fi
            printf '%s\n' "${VANE_MINISIGN_PASSWORD:-}" | minisign -S -s "$KEY_FILE" -m SHA256SUMS -x SHA256SUMS.minisig
            echo "Signed SHA256SUMS with minisign (SHA256SUMS.minisig)."
          else
            echo "Error: unrecognized VANE_RELEASE_SIGNING_KEY format (expected OpenSSL Ed25519 PEM or minisign secret key)." >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz*
            artifacts/SHA256SUMS*

  publish-ghcr:
    name: Build & Push Multi-Arch GHCR Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (SemVer tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch container image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
