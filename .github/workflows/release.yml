name: Release & GHCR

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Standard SemVer Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare-signing-pubkey:
    name: Resolve Built-in Ed25519 Update Public Key
    runs-on: ubuntu-latest
    outputs:
      pubkey_hex: ${{ steps.derive.outputs.pubkey_hex }}
    steps:
      - name: Derive Ed25519 public key (hex)
        id: derive
        shell: bash
        env:
          VANE_RELEASE_SIGNING_KEY: ${{ secrets.VANE_RELEASE_SIGNING_KEY }}
          VANE_BUILTIN_UPDATE_PUBKEY: ${{ vars.VANE_BUILTIN_UPDATE_PUBKEY }}
        run: |
          set -euo pipefail
          PUBKEY_HEX=""
          if [ -n "${VANE_RELEASE_SIGNING_KEY:-}" ] && printf '%s\n' "$VANE_RELEASE_SIGNING_KEY" | head -n 1 | grep -q '^-----BEGIN '; then
            KEY_FILE="$(mktemp)"
            trap 'rm -f "$KEY_FILE"' EXIT
            chmod 0600 "$KEY_FILE"
            printf '%s\n' "$VANE_RELEASE_SIGNING_KEY" > "$KEY_FILE"
            DER_HEX="$(openssl pkey -in "$KEY_FILE" -pubout -outform DER | od -An -tx1 | tr -d ' \n')"
            if [ "${#DER_HEX}" -ne 88 ] || [ "${DER_HEX:0:24}" != "302a300506032b6570032100" ]; then
              echo "Error: VANE_RELEASE_SIGNING_KEY is not an Ed25519 OpenSSL key (unexpected SPKI DER)." >&2
              exit 1
            fi
            PUBKEY_HEX="${DER_HEX:24}"
            echo "Derived built-in Ed25519 public key (${PUBKEY_HEX:0:8}...${PUBKEY_HEX:56}) from secrets.VANE_RELEASE_SIGNING_KEY."
          elif [ -n "${VANE_BUILTIN_UPDATE_PUBKEY:-}" ]; then
            PUBKEY_HEX="$(printf '%s' "$VANE_BUILTIN_UPDATE_PUBKEY" | tr -d '[:space:]')"
            echo "Using built-in Ed25519 public key from vars.VANE_BUILTIN_UPDATE_PUBKEY."
          else
            echo "Notice: No Ed25519 signing key configured; release binaries will build without a built-in update public key."
          fi
          echo "pubkey_hex=${PUBKEY_HEX}" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Package Binary (${{ matrix.target }})
    needs: prepare-signing-pubkey
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset_target: linux-amd64
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            asset_target: linux-arm64
            os: ubuntu-latest
            use_cross: true
          - target: armv7-unknown-linux-musleabihf
            asset_target: linux-armv7
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            asset_target: darwin-arm64
            os: macos-latest
            use_cross: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: Build Svelte 5 Web UI (.br & .gz)
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build static binary with cross
        if: matrix.use_cross
        env:
          VANE_BUILTIN_UPDATE_PUBKEY: ${{ needs.prepare-signing-pubkey.outputs.pubkey_hex }}
        run: |
          cargo install cross --version 0.2.5 --locked
          cross build --release --locked --target ${{ matrix.target }}

      - name: Build native binary
        if: '!matrix.use_cross'
        env:
          VANE_BUILTIN_UPDATE_PUBKEY: ${{ needs.prepare-signing-pubkey.outputs.pubkey_hex }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          STAGE="vane-${TAG}-${{ matrix.asset_target }}"
          mkdir -p dist-release
          cp "target/${{ matrix.target }}/release/vane" ./vane
          tar -czf "dist-release/${STAGE}.tar.gz" vane config.example.toml README.md README_CN.md LICENSE scripts/install.sh

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.asset_target }}
          path: dist-release/*.tar.gz

  publish-release:
    name: Publish GitHub Release & SHA256SUMS
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download all release archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Sign SHA256SUMS (optional Ed25519 / minisign)
        working-directory: artifacts
        shell: bash
        env:
          VANE_RELEASE_SIGNING_KEY: ${{ secrets.VANE_RELEASE_SIGNING_KEY }}
          VANE_MINISIGN_PASSWORD: ${{ secrets.VANE_MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${VANE_RELEASE_SIGNING_KEY:-}" ]; then
            echo "Notice: secrets.VANE_RELEASE_SIGNING_KEY is not configured; skipping detached signature generation."
            exit 0
          fi
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          chmod 0600 "$KEY_FILE"
          printf '%s\n' "$VANE_RELEASE_SIGNING_KEY" > "$KEY_FILE"
          if head -n 1 "$KEY_FILE" | grep -q '^-----BEGIN '; then
            openssl pkey -in "$KEY_FILE" -pubout > RELEASE_PUBKEY.pem
            openssl pkey -in "$KEY_FILE" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n' > RELEASE_PUBKEY.hex
            printf '\n' >> RELEASE_PUBKEY.hex
            openssl pkeyutl -sign -inkey "$KEY_FILE" -rawin -in SHA256SUMS -out SHA256SUMS.sig
            # 同时为每个归档生成原始 Ed25519 分离签名（Base64），供 Web UI 手动上传更新验签
            for f in *.tar.gz; do
              openssl pkeyutl -sign -inkey "$KEY_FILE" -rawin -in "$f" | base64 -w 0 > "${f}.sig.b64"
            done
            echo "Signed SHA256SUMS (SHA256SUMS.sig), archives (*.tar.gz.sig.b64), and exported RELEASE_PUBKEY.{pem,hex}."
          elif head -n 1 "$KEY_FILE" | grep -q '^untrusted comment:'; then
            if ! command -v minisign >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y minisign
            fi
            printf '%s\n' "${VANE_MINISIGN_PASSWORD:-}" | minisign -S -s "$KEY_FILE" -m SHA256SUMS -x SHA256SUMS.minisig
            echo "Signed SHA256SUMS with minisign (SHA256SUMS.minisig)."
          else
            echo "Error: unrecognized VANE_RELEASE_SIGNING_KEY format (expected OpenSSL Ed25519 PEM or minisign secret key)." >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz*
            artifacts/SHA256SUMS*
            artifacts/RELEASE_PUBKEY.*

  publish-ghcr:
    name: Build & Push Multi-Arch GHCR Image
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download prebuilt Linux binaries (amd64 & arm64)
        uses: actions/download-artifact@v4
        with:
          pattern: binary-linux-a*64
          path: artifacts-docker
          merge-multiple: true

      - name: Stage platform binaries for Docker Buildx
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-docker/linux/amd64 dist-docker/linux/arm64
          AMD64_TAR="$(ls artifacts-docker/*-linux-amd64.tar.gz | head -n 1)"
          ARM64_TAR="$(ls artifacts-docker/*-linux-arm64.tar.gz | head -n 1)"
          tar -xzf "$AMD64_TAR" -C dist-docker/linux/amd64 vane
          tar -xzf "$ARM64_TAR" -C dist-docker/linux/arm64 vane
          chmod 0755 dist-docker/linux/amd64/vane dist-docker/linux/arm64/vane
          ls -lh dist-docker/linux/amd64/vane dist-docker/linux/arm64/vane

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (SemVer tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch container image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./dist-docker
          file: ./Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
